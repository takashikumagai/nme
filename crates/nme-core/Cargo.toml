[package]
name = "nme-core"
description = "Format-agnostic metadata model and per-format backends for nme"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
lopdf = { version = "0.34" }
id3 = "1"
metaflac = "0.2.8"
mp4ameta = { version = "0.13.0" }

[dev-dependencies]
# Only used by tests, to build fixture PDFs in a scratch directory instead
# of depending on a committed .pdf file. MIT/Apache-2.0.
tempfile = "3"
